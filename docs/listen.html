<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Out Sounds</title>
<style>
 :root { --bg:#f6f1e7; --card:#fff; --ink:#24211d; --muted:#6f675c; --acc:#2f6f8f; --alt:#6f675c; --line:#eee; --th:#efe8dc; }
 @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1d1b18; --card:#2a2723; --ink:#f0ebe2; --muted:#b3aa9c; --acc:#5aa3c6; --alt:#7d7569; --line:#3b3732; --th:#34302b; } }
 :root[data-theme="dark"] { --bg:#1d1b18; --card:#2a2723; --ink:#f0ebe2; --muted:#b3aa9c; --acc:#5aa3c6; --alt:#7d7569; --line:#3b3732; --th:#34302b; }
 * { box-sizing: border-box; }
 body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 760px; padding: 16px; background: var(--bg); color: var(--ink); }
 h1 { font-size: 1.4rem; margin: 0 0 6px; } p { color: var(--muted); margin: 0 0 12px; }
 .card { background: var(--card); border-radius: 12px; }
 .blend { padding: 12px; margin: 0 0 14px; }
 table { width: 100%; border-collapse: collapse; }
 td, th { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
 th { background: var(--th); font-size: .85rem; }
 button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 0; background: var(--acc); color: #fff; margin: 2px; min-height: 40px; cursor: pointer; }
 button.alt { background: var(--alt); }
 .g { font: 600 1.6rem "Andika", Verdana, sans-serif; width: 3.2em; }
 .none { color: var(--muted); }
 @media (max-width: 520px) { td, th { padding: 6px 4px; } button { padding: 6px 9px; font-size: .9rem; } .g { width: 2.4em; font-size: 1.3rem; } }
</style>
</head>
<body>
<h1>The sounds Sound Out teaches</h1>
<p>These are the Level 1 sounds the app plays, one row per letter or letter pair. Tap "sound" to hear the sound the letter makes, "name" for the letter's name, and the word to hear it in a word.</p>
<div class="card blend">
 <b>Putting sounds together:</b>
 <button id="blend">sound /s/, sound /a/, sound /t/, then word: sat</button>
</div>
<div class="card"><table><thead><tr><th>Letter</th><th>Sound</th><th>Letter name</th><th>Example word</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const play = src => new Promise(r => { const a = new Audio(src); a.onended = r; a.onerror = r; a.play().catch(r); });
const wait = ms => new Promise(r => setTimeout(r, ms));
const clip = id => `audio/${id}.ogg`;
fetch('listen-data.json').then(r => r.json()).then(d => {
  const tb = document.getElementById('rows');
  for (const r of d.rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="g">${r.g}</td>
      <td><button data-s="${clip(r.sound)}">sound /${r.pid}/</button></td>
      <td>${r.name ? `<button class="alt" data-s="${clip(r.name)}">name ${r.nameLabel}</button>` : '<span class="none">(two letters)</span>'}</td>
      <td><button class="alt" data-s="${clip(r.wordId)}">word: ${r.word}</button></td>`;
    tb.append(tr);
  }
  tb.addEventListener('click', e => { const s = e.target.dataset.s; if (s) play(s); });
  document.getElementById('blend').onclick = async () => {
    for (const id of d.blend) { await play(clip(id)); await wait(350); }
    await play(clip(d.sat));
  };
});
</script>
</body>
</html>
