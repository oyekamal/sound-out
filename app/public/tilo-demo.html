<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tilo demo (dev only)</title>
<style>
  body{margin:0;background:#f6f1e7;font:16px system-ui,sans-serif;color:#24211d;display:grid;justify-items:center;gap:14px;padding:18px}
  .stage{position:relative;width:225px;height:256px}
  .stage img{position:absolute;left:0;top:0;width:225px;height:256px;transform-origin:50% 100%}
  .breathe{animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.022)}}
  #mouth{position:absolute;height:auto}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{border:0;border-radius:999px;padding:12px 20px;font-weight:650;background:#2f6f8f;color:#fff;min-height:48px}
  button.alt{background:#fffdf8;color:#24211d;box-shadow:inset 0 0 0 2px #e3dacb}
  code{font-size:.8rem;color:#6f675c}
</style></head><body>
<h3 style="margin:0">Tilo: breathing + lip-flap</h3>
<div class="stage" id="stage"><img id="body" class="breathe" alt="Tilo"><img id="mouth" alt="" hidden></div>
<div class="row">
  <button id="talk">Speak (sample clip)</button>
  <button class="alt" data-pose="idle">idle</button><button class="alt" data-pose="listening">listening</button>
  <button class="alt" data-pose="pointing">pointing</button><button class="alt" data-pose="thinking">thinking</button>
  <button class="alt" data-pose="encouraging">try again</button><button class="alt" data-pose="celebrating">celebrating</button>
</div>
<code id="info">loading…</code>
<script>
const CLIP = 'audio/b79a34ebfcaa.ogg';   // ~3.4 s sample clip from app/public/audio
const $ = id => document.getElementById(id);
const body = $('body'), mouth = $('mouth'), info = $('info');
let M, size = '1x', talking = false, raf = 0;
const dpr = Math.min(2, Math.ceil(window.devicePixelRatio || 1)); size = dpr >= 2 ? '2x' : '1x';
const stage = $('stage');
function setPose(p) { if (talking) return; mouth.hidden = true; body.src = M.poses[p][size]; }
function placeMouth(name) {
  const m = M.talk.mouths[name], k = size, f = 225 / (k === '2x' ? 450 : 225);   // stage is 225 css px wide
  mouth.src = m.files[k]; mouth.style.left = m.offset[k][0] * f + 'px'; mouth.style.top = m.offset[k][1] * f + 'px';
  mouth.style.width = (k === '2x' ? 66 : 33) * f + 'px'; mouth.hidden = false;
}
fetch('img/tilo/tilo.json').then(r => r.json()).then(j => {
  M = j; body.src = M.poses.idle[size];
  info.textContent = 'size ' + size + ' · ' + Object.keys(M.poses).length + ' poses · ' + Object.keys(M.faces).length + ' faces';
  document.querySelectorAll('[data-pose]').forEach(b => b.onclick = () => setPose(b.dataset.pose));
  Object.values(M.talk.mouths).forEach(m => Object.values(m.files).forEach(f => new Image().src = f));
});
$('talk').onclick = async () => {
  if (talking) return; talking = true;
  body.src = M.talk.body[size];
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), a = new Audio(CLIP);
  const src = ctx.createMediaElementSource(a), an = ctx.createAnalyser(); an.fftSize = 512; src.connect(an); an.connect(ctx.destination);
  const buf = new Uint8Array(an.fftSize); let cur = 'mmm', hold = 0, last = 0;
  const tick = t => {
    an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) s += (v - 128) ** 2; const rms = Math.sqrt(s / buf.length) / 128;
    // loudness picks the mouth; hold each shape ~70 ms so it flaps instead of flickering
    if (t - last > 70) { last = t; cur = rms < 0.025 ? 'mmm' : rms < 0.08 ? 'ooo' : rms < 0.16 ? 'mid' : 'aaa'; }
    placeMouth(cur); if (!a.ended) raf = requestAnimationFrame(tick);
  };
  a.onended = () => { cancelAnimationFrame(raf); talking = false; setPose('idle'); ctx.close(); };
  await ctx.resume(); a.play().then(() => raf = requestAnimationFrame(tick)).catch(e => { info.textContent = 'audio blocked: ' + e; talking = false; });
};
</script></body></html>
